<!doctype html>
<html lang="en">
<head>
  <title>Sound Objects Archive — Browse</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
  <div class="container">
    <div class="nav">
      <div class="brand">SOUND OBJECTS ARCHIVE</div>
      <div class="navlinks">
        <a href="./index.html">Home</a>
        <a class="active" href="./browse.html">Browse</a>
        <a href="./about.html">About</a>
      </div>
    </div>

    <div class="hero">
      <div class="center-buttons">
        <a href="./index.html">Introduction</a>
        <a href="./about.html">Information for users</a>
      </div>

      <div class="search-row">
        <input id="q" class="input" type="text" placeholder="Search in Objects" />
      </div>

      <div class="filter-button-wrap">
        <button class="filter-button" type="button" onclick="document.getElementById('tagSection').scrollIntoView({behavior:'smooth'})">
          Filter by keywords
        </button>
      </div>

      <div class="view-toggle">
        <span>▦ Grid</span>
        <span>≡ List</span>
      </div>

      <div id="tagSection" class="card" style="margin-bottom: 24px;">
        <div class="row" style="justify-content: space-between;">
          <div class="small">Filter by tag</div>
          <div class="small"><span id="resultCount">0 results</span></div>
        </div>
        <div id="tagChips" class="tags"></div>
      </div>

      <div id="entryList" class="cards"></div>

      <div class="footer">
        Browse sound objects by keyword, title, place, date, or tag.
      </div>
    </div>
  </div>

  <script src="./assets/app.js"></script>
  <script>
    TemplateApp.initBrowse();
  </script>
</body>
</html>
